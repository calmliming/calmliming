<svg xmlns="http://www.w3.org/2000/svg" width="415" height="160" viewBox="0 0 415 160" role="img" aria-label="luna-care：记录女朋友的生理期，推算下一次并提前提醒。数据只存在手机本地。">
<style>
  text { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", sans-serif; }
  .card { fill: #EEF2F5; }
  .name { fill: #22303D; font-size: 18px; font-weight: 600; }
  .desc { fill: #4E5D6C; font-size: 14px; }
  .meta { fill: #6B7A89; font-size: 12.5px; }
  .icon { fill: none; stroke: #8496A8; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-color-scheme: dark) {
    .card { fill: #161E28; }
